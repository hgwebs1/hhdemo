<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sequential Copy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    padding: 20px;
  }

  .list {
    background: #111827;
    border: 1px solid #374151;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  #number {
    position: fixed;
    bottom: 0;
    left: 0;
    opacity: 0;
    height: 1px;
    width: 1px;
  }
</style>
</head>
<body>

<h3>Tap any line</h3>

<div class="list" data-text="This is first example text with ten words here">
  This is first example text with ten words here
</div>

<div class="list" data-text="Second example line contains exactly ten simple words now">
  Second example line contains exactly ten simple words now
</div>

<div class="list" data-text="Third sample sentence written only for demo purpose">
  Third sample sentence written only for demo purpose
</div>

<!-- only for keyboard -->
<input id="number" type="number" inputmode="numeric">

<script>
  const input = document.getElementById("number");

  document.querySelectorAll(".list").forEach(item => {
    item.onclick = async () => {

      // 🔑 open number keyboard
      input.focus();

      // 1️⃣ copy ONLY number
      await navigator.clipboard.writeText("1234567890");

      // 2️⃣ small delay (required)
      setTimeout(async () => {
        await navigator.clipboard.writeText(item.dataset.text);
      }, 80);

    };
  });
</script>

</body>
</html>
