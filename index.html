<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Cloud Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        body { background: #020617; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        input, select { background: #1e293b !important; color: white !important; border: 1px solid #334155 !important; }
        .site-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .loader { border-right-color: transparent; animation: rot 1s linear infinite; }
        @keyframes rot { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-6xl mx-auto flex justify-between items-center mb-12">
        <h1 class="text-2xl font-black tracking-tight text-blue-500">NETLIFY<span class="text-white font-light">CORE</span></h1>
        <div class="px-4 py-1 rounded-full border border-green-500/30 bg-green-500/10 text-green-400 text-[10px] font-bold uppercase tracking-widest">
            ● Authorized Session
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <section class="lg:col-span-5 p-8 glass rounded-3xl shadow-2xl h-fit">
            <h2 class="text-xl font-bold mb-8 flex items-center gap-3">🚀 <span class="bg-blue-600 px-2 py-0.5 rounded text-sm">Deploy</span></h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Source Repository</label>
                    <select id="repoSelect" onchange="fetchBranches()" class="w-full p-3 rounded-xl outline-none text-sm"></select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Default Branch</label>
                    <select id="branchSelect" class="w-full p-3 rounded-xl outline-none text-sm">
                        <option>Choose repo first</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Site Name</label>
                    <div class="relative">
                        <input type="text" id="siteName" oninput="checkDomain(this.value)" placeholder="e.g. my-app-2024" class="w-full p-3 rounded-xl outline-none text-sm">
                        <div id="domainLoader" class="hidden absolute right-3 top-3 w-5 h-5 border-2 border-blue-500 loader rounded-full"></div>
                    </div>
                    <p id="domainStatus" class="text-[11px] mt-2 font-semibold"></p>
                </div>

                <div class="flex items-center gap-3 p-4 bg-white/5 rounded-2xl hover:bg-white/10 transition cursor-pointer">
                    <input type="checkbox" id="autoFunc" class="w-5 h-5 accent-blue-500">
                    <span class="text-xs text-gray-300">Auto-set <b>/functions</b> directory</span>
                </div>

                <div class="pt-4 border-t border-white/5">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-bold text-gray-400 uppercase">Environment</span>
                        <button onclick="addEnvField('envList')" class="bg-blue-600 hover:bg-blue-500 text-white p-1 rounded-lg text-xs px-3 font-bold">+ New Key</button>
                    </div>
                    <div id="envList" class="space-y-3"></div>
                </div>

                <button onclick="deployNow()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-black text-sm tracking-widest mt-6 transition-all shadow-xl shadow-blue-900/40">
                    DEPLOY TO CLOUD
                </button>
            </div>
        </section>

        <section class="lg:col-span-7">
            <h2 class="text-xl font-bold mb-8 text-gray-400">Deployed Instances</h2>
            <div id="sitesList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
        </section>
    </main>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center p-6 z-50">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-lg border border-white/20">
            <div class="flex justify-between items-start mb-10">
                <h3 id="modalTitle" class="text-3xl font-black italic">Settings</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-white text-3xl">&times;</button>
            </div>
            
            <div class="space-y-8">
                <div>
                    <div class="flex justify-between mb-4">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Site Variables</label>
                        <button onclick="addEnvField('modalEnvList')" class="text-blue-500 text-xs font-bold hover:underline">+ Add New</button>
                    </div>
                    <div id="modalEnvList" class="space-y-3 max-h-52 overflow-y-auto pr-2 custom-scroll"></div>
                </div>

                <div class="pt-6 border-t border-white/10">
                    <button onclick="triggerManualDeploy()" class="w-full flex items-center justify-center gap-3 bg-white text-black py-4 rounded-2xl font-black hover:bg-gray-200 transition">
                        <span>⚡</span> TRIGGER DEPLOYMENT
                    </button>
                    <p class="text-center text-[10px] text-gray-500 mt-4 uppercase tracking-tighter">Requires confirmation on click</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const HLOCALSAVE = "https://hlocalsave.netlify.app";
        const G_TOKEN = localStorage.getItem("GITHUB_TOKEN");
        const N_TOKEN = localStorage.getItem("NETLIFY_TOKEN");

        async function init() {
            if (!G_TOKEN || !N_TOKEN) {
                const missing = [];
                if(!G_TOKEN) missing.push("GITHUB_TOKEN");
                if(!N_TOKEN) missing.push("NETLIFY_TOKEN");
                window.location.replace(`${HLOCALSAVE}?request=keys&keys=${missing.join(",")}&return=${encodeURIComponent(location.href)}`);
                return;
            }
            fetchRepos();
            fetchSites();
        }

        /* FETCH REPOS & BRANCHES */
        async function fetchRepos() {
            try {
                const res = await fetch('https://api.github.com/user/repos?sort=updated&per_page=50', {
                    headers: { 'Authorization': `token ${G_TOKEN}` }
                });
                const repos = await res.json();
                document.getElementById("repoSelect").innerHTML = repos.map(r => `<option value="${r.full_name}">${r.full_name}</option>`).join('');
                fetchBranches();
            } catch (e) { console.error("Repo Error", e); }
        }

        async function fetchBranches() {
            const repo = document.getElementById("repoSelect").value;
            const res = await fetch(`https://api.github.com/repos/${repo}/branches`, {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const branches = await res.json();
            document.getElementById("branchSelect").innerHTML = branches.map(b => `<option value="${b.name}">${b.name}</option>`).join('');
        }

        /* DOMAIN VALIDATION (FIXED) */
        let domainTimer;
        function checkDomain(name) {
            clearTimeout(domainTimer);
            const status = document.getElementById("domainStatus");
            const loader = document.getElementById("domainLoader");
            if(name.length < 3) { status.innerText = ""; return; }

            loader.classList.remove("hidden");
            domainTimer = setTimeout(async () => {
                try {
                    // Direct name check using site search API with Auth
                    const res = await fetch(`https://api.netlify.com/api/v1/sites?name=${name}`, {
                        headers: { 'Authorization': `Bearer ${N_TOKEN}` }
                    });
                    const sites = await res.json();
                    const isTaken = sites.some(s => s.name.toLowerCase() === name.toLowerCase());
                    
                    if(!isTaken) {
                        status.innerText = "Available: " + name + ".netlify.app";
                        status.className = "text-[11px] mt-2 text-emerald-400";
                    } else {
                        status.innerText = "Unavailable: Name already exists";
                        status.className = "text-[11px] mt-2 text-rose-500";
                    }
                } catch(e) { status.innerText = "Error checking domain."; }
                loader.classList.add("hidden");
            }, 700);
        }

        /* KEY-VALUE ENV FIELDS */
        function addEnvField(containerId, key = '', val = '') {
            const div = document.createElement('div');
            div.className = "flex gap-2 animate-in fade-in zoom-in duration-200";
            div.innerHTML = `
                <input type="text" placeholder="KEY" value="${key}" class="w-1/2 p-2.5 text-[11px] rounded-lg font-bold">
                <input type="text" placeholder="VALUE" value="${val}" class="w-1/2 p-2.5 text-[11px] rounded-lg">
                <button onclick="this.parentElement.remove()" class="text-gray-500 hover:text-red-500 px-1">✕</button>
            `;
            document.getElementById(containerId).appendChild(div);
        }

        /* SITES LIST */
        async function fetchSites() {
            const container = document.getElementById("sitesList");
            try {
                const res = await fetch('https://api.netlify.com/api/v1/sites', {
                    headers: { 'Authorization': `Bearer ${N_TOKEN}` }
                });
                const sites = await res.json();
                container.innerHTML = sites.map(s => `
                    <div onclick="openSettings('${s.id}', '${s.name}')" class="site-card p-6 glass rounded-2xl cursor-pointer border border-white/5 transition-all group">
                        <p class="text-[10px] text-gray-500 mb-1 font-mono uppercase tracking-widest">${s.id}</p>
                        <h4 class="font-black text-white group-hover:text-blue-500 transition">${s.name}</h4>
                        <div class="mt-4 flex justify-end">
                            <span class="text-[9px] bg-blue-600/20 text-blue-400 px-2 py-1 rounded-md font-bold uppercase">Configure ⚙️</span>
                        </div>
                    </div>
                `).join('');
            } catch(e) { container.innerHTML = "Error loading sites."; }
        }

        let activeSiteId = "";
        function openSettings(id, name) {
            activeSiteId = id;
            document.getElementById("settingsModal").classList.remove("hidden");
            document.getElementById("modalTitle").innerText = name;
            document.getElementById("modalEnvList").innerHTML = "";
            addEnvField('modalEnvList'); // Default input
        }

        function closeModal() { document.getElementById("settingsModal").classList.add("hidden"); }

        async function triggerManualDeploy() {
            const confirmDeploy = confirm("Trigger a new deployment build for this site?");
            if(!confirmDeploy) return;
            
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = "TRIGGERING...";
            btn.disabled = true;

            try {
                const res = await fetch(`https://api.netlify.com/api/v1/sites/${activeSiteId}/builds`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${N_TOKEN}` }
                });
                if(res.ok) alert("Deployment successfully triggered!");
                else alert("Trigger failed. Please check tokens.");
            } catch(e) { alert("Error connecting to Netlify."); }
            
            btn.innerHTML = originalText;
            btn.disabled = false;
        }

        window.onload = init;
    </script>
</body>
</html>
