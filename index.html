<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: #0f172a; border: 1px solid #1e293b; }
        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        input, select { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
        .loader { border-right-color: transparent; animation: rot 1s linear infinite; }
        @keyframes rot { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6 md:p-12">

    <header class="max-w-6xl mx-auto flex justify-between items-center mb-10">
        <h1 class="text-2xl font-black text-blue-500 italic">NETLIFY<span class="text-white">API_SYNC</span></h1>
        <div class="flex items-center gap-2 text-[10px] font-bold text-green-500 bg-green-500/10 px-3 py-1 rounded-full">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span> AUTHENTICATED
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <section class="lg:col-span-5 p-8 glass rounded-[2rem] shadow-2xl h-fit border border-blue-500/20">
            <h2 class="text-xl font-bold mb-6">🚀 Deploy Engine</h2>
            <div class="space-y-4">
                <select id="repoSelect" onchange="fetchBranches()" class="w-full p-3 rounded-xl text-sm"></select>
                <select id="branchSelect" class="w-full p-3 rounded-xl text-sm"></select>
                
                <div class="relative">
                    <input type="text" id="siteName" oninput="checkDomain(this.value)" placeholder="Enter site name" class="w-full p-3 rounded-xl text-sm outline-none">
                    <div id="domainLoader" class="hidden absolute right-3 top-3.5 w-4 h-4 border-2 border-blue-500 loader rounded-full"></div>
                </div>
                <p id="domainStatus" class="text-[11px] font-bold min-h-[15px]"></p>

                <label class="flex items-center gap-3 p-4 bg-white/5 rounded-xl cursor-pointer">
                    <input type="checkbox" id="autoFunc" class="w-4 h-4 accent-blue-500">
                    <span class="text-xs">Auto Netlify Directory (functions)</span>
                </label>

                <div class="pt-4 border-t border-gray-800">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-gray-500 uppercase">Env Variables</span>
                        <button onclick="addEnvField('envList')" class="bg-blue-600 text-white px-3 py-1 rounded text-[10px]">+ ADD</button>
                    </div>
                    <div id="envList" class="space-y-2"></div>
                </div>

                <button onclick="deployNow()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-xs tracking-widest hover:bg-blue-700 transition">DEPLOY TO NETLIFY</button>
            </div>
        </section>

        <section class="lg:col-span-7">
            <h2 class="text-xl font-bold mb-6 text-gray-500">Live Deployments</h2>
            <div id="sitesList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>
    </main>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-50">
        <div class="glass p-8 rounded-[2rem] w-full max-w-lg">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-2xl font-black text-blue-400">SETTINGS</h3>
                <button onclick="closeModal()" class="text-white text-2xl">&times;</button>
            </div>
            
            <div id="modalContent" class="space-y-6">
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-[10px] font-bold text-gray-500">ENVIRONMENT KEYS</label>
                        <button onclick="addEnvField('modalEnvList')" class="text-blue-500 text-[10px]">+ ADD NEW</button>
                    </div>
                    <div id="modalEnvList" class="space-y-2 bg-black/40 p-4 rounded-xl max-h-40 overflow-y-auto"></div>
                </div>

                <div class="space-y-3 border-t border-gray-800 pt-6">
                    <button onclick="saveSettings()" id="saveBtn" class="w-full bg-emerald-600 py-4 rounded-2xl font-black text-xs tracking-widest hover:bg-emerald-700">
                        SAVE SETTINGS
                    </button>
                    <button onclick="triggerDeploy()" id="triggerBtn" class="w-full bg-white/5 border border-white/10 py-4 rounded-2xl font-black text-xs tracking-widest hover:bg-white/10">
                        ⚡ TRIGGER MANUAL DEPLOY
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const G_TOKEN = localStorage.getItem("GITHUB_TOKEN");
        const N_TOKEN = localStorage.getItem("NETLIFY_TOKEN");
        let activeSiteId = "";

        // Official Initializer
        window.onload = () => {
            if(!G_TOKEN || !N_TOKEN) {
                // Fallback to your HLOCALSAVE redirect logic here
                return;
            }
            fetchRepos();
            fetchSites();
        };

        /* OFFICIAL DOMAIN CHECK */
        let domainTimer;
        function checkDomain(name) {
            clearTimeout(domainTimer);
            const status = document.getElementById("domainStatus");
            const loader = document.getElementById("domainLoader");
            if(name.length < 3) { status.innerText = ""; return; }

            loader.classList.remove("hidden");
            domainTimer = setTimeout(async () => {
                try {
                    // Official Netlify API: Searching for a site by name across global network
                    const res = await fetch(`https://api.netlify.com/api/v1/sites?name=${name}`, {
                        headers: { 'Authorization': `Bearer ${N_TOKEN}` }
                    });
                    const data = await res.json();
                    
                    // Netlify returns an array. If array has items, name is taken.
                    const isTaken = data.some(site => site.name.toLowerCase() === name.toLowerCase());

                    if(!isTaken) {
                        status.innerText = "✅ Name is Available";
                        status.className = "text-[11px] font-bold text-emerald-400";
                    } else {
                        status.innerText = "❌ Name is Already Taken";
                        status.className = "text-[11px] font-bold text-red-500";
                    }
                } catch(e) { status.innerText = "Error checking domain"; }
                loader.classList.add("hidden");
            }, 700);
        }

        /* ENV FIELD GENERATOR */
        function addEnvField(containerId, key = '', val = '') {
            const div = document.createElement('div');
            div.className = "flex gap-2";
            div.innerHTML = `
                <input type="text" placeholder="KEY" value="${key}" class="w-1/2 p-2 text-[10px] rounded-lg font-bold env-key">
                <input type="text" placeholder="VALUE" value="${val}" class="w-1/2 p-2 text-[10px] rounded-lg env-val">
                <button onclick="this.parentElement.remove()" class="text-gray-500 px-1">✕</button>
            `;
            document.getElementById(containerId).appendChild(div);
        }

        /* FETCH GITHUB DATA */
        async function fetchRepos() {
            const res = await fetch('https://api.github.com/user/repos?sort=updated', {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const repos = await res.json();
            document.getElementById("repoSelect").innerHTML = repos.map(r => `<option value="${r.full_name}">${r.full_name}</option>`).join('');
            fetchBranches();
        }

        async function fetchBranches() {
            const repo = document.getElementById("repoSelect").value;
            const res = await fetch(`https://api.github.com/repos/${repo}/branches`, {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const branches = await res.json();
            document.getElementById("branchSelect").innerHTML = branches.map(b => `<option value="${b.name}">${b.name}</option>`).join('');
        }

        /* NETLIFY SITES LIST */
        async function fetchSites() {
            const res = await fetch('https://api.netlify.com/api/v1/sites', {
                headers: { 'Authorization': `Bearer ${N_TOKEN}` }
            });
            const sites = await res.json();
            document.getElementById("sitesList").innerHTML = sites.map(s => `
                <div onclick="openSettings('${s.id}', '${s.name}')" class="p-5 glass rounded-2xl cursor-pointer hover:border-blue-500 transition group">
                    <h4 class="font-bold text-white group-hover:text-blue-400 truncate">${s.name}</h4>
                    <p class="text-[10px] text-gray-500">${s.url.replace('https://','')}</p>
                </div>
            `).join('');
        }

        /* SETTINGS & SAVE LOGIC */
        function openSettings(id, name) {
            activeSiteId = id;
            document.getElementById("settingsModal").classList.remove("hidden");
            document.getElementById("modalTitle").innerText = name;
            document.getElementById("modalEnvList").innerHTML = "";
            addEnvField('modalEnvList');
        }

        function closeModal() { document.getElementById("settingsModal").classList.add("hidden"); }

        async function saveSettings() {
            const keys = document.querySelectorAll('#modalEnvList .env-key');
            const vals = document.querySelectorAll('#modalEnvList .env-val');
            let envObj = {};
            keys.forEach((k, i) => { if(k.value) envObj[k.value] = vals[i].value; });

            const btn = document.getElementById("saveBtn");
            btn.innerText = "SAVING...";
            
            // Official Netlify API to update environment variables
            const res = await fetch(`https://api.netlify.com/api/v1/sites/${activeSiteId}`, {
                method: 'PATCH',
                headers: { 
                    'Authorization': `Bearer ${N_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ build_settings: { env: envObj } })
            });

            if(res.ok) {
                alert("Official Update Success!");
                closeModal();
            } else { alert("Update failed."); }
            btn.innerText = "SAVE SETTINGS";
        }

        async function triggerDeploy() {
            if(!confirm("Trigger Official Build?")) return;
            const res = await fetch(`https://api.netlify.com/api/v1/sites/${activeSiteId}/builds`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${N_TOKEN}` }
            });
            if(res.ok) alert("Build Triggered Successfully!");
        }
    </script>
</body>
</html>
