<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keyboard + Reliable Copy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    padding: 20px;
  }

  .item {
    background: #111827;
    border: 1px solid #374151;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
  }

  /* keyboard trigger input */
  #number {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
  }
</style>
</head>
<body>

<h3>Tap any line</h3>

<div class="item" data-text="This is first example text with ten words here">
  This is first example text with ten words here
</div>

<div class="item" data-text="Second example line contains exactly ten simple words now">
  Second example line contains exactly ten simple words now
</div>

<div class="item" data-text="Third sample sentence written only for demo purpose">
  Third sample sentence written only for demo purpose
</div>

<!-- REQUIRED for keyboard -->
<input id="number" type="number" inputmode="numeric">

<script>
  const input = document.getElementById("number");

  function copySync(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }

  document.querySelectorAll(".item").forEach(el => {
    el.onclick = () => {

      // 1️⃣ open number keyboard
      input.focus();

      // 2️⃣ copy number (guaranteed)
      copySync("1234567890");

      // 3️⃣ immediately overwrite with only text
      copySync(el.dataset.text);
    };
  });
</script>

</body>
</html>
