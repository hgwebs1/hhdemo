<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ollama Chat (Qwen2.5-Coder)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 10px; shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 80vh; border: 1px solid #ddd; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 14px; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .bot { background: #e9ecef; color: #333; align-self: flex-start; white-space: pre-wrap; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; background: #fafafa; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; margin-left: 10px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="chat-container">
    <div style="padding: 10px; background: #333; color: white; text-align: center; font-weight: bold;">
        Ollama API Chat (Qwen 7B)
    </div>
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Yahan apna sawal likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">Bhejein</button>
    </div>
</div>

<script>
    // --- APNI SETTINGS YAHAN KAREIN ---
    const API_URL = "https://hollama.serveousercontent.com/api/generate";
    const MODEL_NAME = "qwen2.5-coder:7b";

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';
        sendBtn.disabled = true;

        const botMsgDiv = appendMessage('bot', 'Soch raha hoon...');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    prompt: text,
                    stream: false // Simple rakhne ke liye false kiya hai
                })
            });

            const data = await response.json();
            botMsgDiv.innerText = data.response;
        } catch (error) {
            botMsgDiv.innerText = "Error: API se connect nahi ho paya. Check karein ki tunnel aur Ollama chal rahe hain.";
            console.error(error);
        } finally {
            sendBtn.disabled = false;
        }
    }
</script>

</body>
</html>
