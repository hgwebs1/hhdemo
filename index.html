<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Input Keyboard Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    padding: 20px;
  }
  .box {
    background: #111827;
    border: 1px solid #374151;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  button {
    margin-top: 8px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 8px;
    margin-top: 6px;
    background: #020617;
    border: 1px solid #334155;
    color: #e5e7eb;
  }
</style>
</head>
<body>

<h2>🔢 Number Input Test</h2>

<div class="box">
  <b>Number input</b>
  <input id="i5" type="number" placeholder="enter number">
  <button onclick="copyAndFocus('123456','i5')">
    Copy + Focus
  </button>
</div>

<script>
function copyAndFocus(text, inputId) {
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById(inputId).focus();
  });
}
</script>

</body>
</html>
