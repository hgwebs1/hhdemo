<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FastPaste</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  font-family: system-ui;
  background:#f5f7fa;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  width:95%;
  max-width:500px;
  background:#fff;
  padding:15px;
  border-radius:12px;
}
textarea{
  width:100%;
  height:200px;
  font-size:15px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#4f46e5;
  color:#fff;
  border:none;
  border-radius:10px;
}
.note{
  font-size:12px;
  color:#666;
  text-align:center;
  margin-top:6px;
}
</style>
</head>
<body>

<div class="box">
  <textarea id="area" placeholder="Paste here..."></textarea>
  <button onclick="manualPaste()">Tap & Paste</button>
  <div class="note">Button tap → keyboard paste → works everywhere</div>
</div>

<script>
function manualPaste(){
  const ta = document.getElementById("area");
  ta.focus();
  ta.select();

  // Android shows paste bar automatically
  alert("अब Paste करें (long press → Paste)");
}
</script>

</body>
</html>
