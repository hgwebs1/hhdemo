<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Qwen2.5 Coder Chat</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --chat-bg: #fff;
            --text-color: #333;
            --user-msg-bg: #007bff;
            --user-msg-text: #fff;
            --bot-msg-bg: #f1f0f0;
            --bot-msg-text: #333;
            --border-color: #ddd;
            --header-bg: #fff;
            --input-bg: #fff;
            --panel-bg: rgba(255,255,255,0.95);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --chat-bg: #2d2d2d;
            --text-color: #eee;
            --user-msg-bg: #1e7e34;
            --user-msg-text: #fff;
            --bot-msg-bg: #3a3a3a;
            --bot-msg-text: #eee;
            --border-color: #444;
            --header-bg: #2d2d2d;
            --input-bg: #3a3a3a;
            --panel-bg: rgba(45,45,45,0.95);
        }

        * { box-sizing: border-color; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; justify-content: center; }

        /* Main App Structure */
        .app-container { width: 100%; max-width: 800px; height: 100%; display: flex; flex-direction: column; background: var(--chat-bg); border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }

        /* Header */
        header { padding: 10px 20px; background: var(--header-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10; }
        .header-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; background: #ccc; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: #28a745; shadow: 0 0 5px #28a745; }
        .header-btns { display: flex; gap: 10px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-color); padding: 5px; border-radius: 5px; }
        .icon-btn:hover { background: rgba(0,0,0,0.1); }
        [data-theme="dark"] .icon-btn:hover { background: rgba(255,255,255,0.1); }

        /* Chat Body */
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message-row { display: flex; width: 100%; }
        .message-row.user-row { justify-content: flex-end; }
        .message-row.bot-row { justify-content: flex-start; }
        
        .message { padding: 12px 16px; border-radius: 18px; max-width: 75%; font-size: 0.95rem; line-height: 1.5; position: relative; word-wrap: break-word; }
        .user-row .message { background-color: var(--user-msg-bg); color: var(--user-msg-text); border-bottom-right-radius: 4px; }
        .bot-row .message { background-color: var(--bot-msg-bg); color: var(--bot-msg-text); border-bottom-left-radius: 4px; }
        
        /* Thinking/Loading animation */
        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; background: var(--bot-msg-bg); border-radius: 18px; border-bottom-left-radius: 4px; }
        .typing-indicator span { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: blink 1.4s infinite both; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

        /* Input Area */
        .input-area { padding: 15px 20px; background: var(--header-bg); border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; }
        #user-input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); outline: none; font-size: 0.95rem; }
        #user-input:focus { border-color: #007bff; }
        #send-btn { background: #007bff; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        #send-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Settings Panel */
        #settings-panel { position: absolute; top: 60px; left: 20px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; shadow: 0 4px 15px rgba(0,0,0,0.2); display: none; z-index: 20; width: 250px; backdrop-filter: blur(5px); }
        .settings-header { font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .setting-item { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        .setting-item label { font-size: 0.85rem; color: var(--text-color); opacity: 0.8; }
        .setting-item select { padding: 5px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); }
        .switch-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
        
        /* Debug Console */
        #debug-console { position: fixed; bottom: 80px; left: 20px; right: 20px; max-height: 200px; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 0.8rem; padding: 10px; border-radius: 5px; overflow-y: auto; display: none; z-index: 30; pointer-events: none; }
    </style>
</head>
<body data-theme="light">

<div class="app-container">
    <header>
        <div class="header-btns">
            <button class="icon-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
        </div>
        <div class="header-title">
            <span id="connection-status" class="status-dot" title="Checking connection..."></span>
            Qwen2.5 Coder
        </div>
        <div class="header-btns">
            <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()" title="Toggle Light/Dark Mode">☀️</button>
        </div>

        <div id="settings-panel">
            <div class="settings-header">Settings</div>
            <div class="setting-item">
                <label>Font Family</label>
                <select id="font-select" onchange="changeFont(this.value)">
                    <option value="'Segoe UI', sans-serif">Default (Segoe)</option>
                    <option value="'Courier New', monospace">Monospace (Code)</option>
                    <option value="Georgia, serif">Serif (Classic)</option>
                </select>
            </div>
            <div class="setting-item">
                <label class="switch-label">
                    <span>Debug Mode</span>
                    <input type="checkbox" id="debug-switch" onchange="toggleDebug(this.checked)">
                </label>
            </div>
        </div>
    </header>

    <div id="chat-box">
        <div class="message-row bot-row">
            <div class="message bot">Namaste! Main Qwen2.5-Coder (7B) hoon. Bataiye main coding mein aapki kya madad kar sakta hoon?</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Apna sawal ya code yahan likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()" title="Bhejein">➤</button>
    </div>
</div>

<div id="debug-console"></div>

<script>
    // --- API Configuration ---
    const BASE_URL = "https://hollama.serveousercontent.com"; 
    const GENERATE_ENDPOINT = `${BASE_URL}/api/generate`;
    const TAGS_ENDPOINT = `${BASE_URL}/api/tags`;
    const MODEL_NAME = "qwen2.5-coder:7b";

    // UI Elements
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDot = document.getElementById('connection-status');
    const debugConsole = document.getElementById('debug-console');
    let isDebugOn = false;

    // Initialize: Check connection on load
    checkConnection();

    // 1. Debug Logger
    function logDebug(type, message, data = '') {
        if (!isDebugOn) return;
        const time = new Date().toLocaleTimeString();
        const logEntry = `[${time}] [${type.toUpperCase()}] ${message} ${data ? JSON.stringify(data) : ''}\n`;
        debugConsole.innerText += logEntry;
        debugConsole.scrollTop = debugConsole.scrollHeight;
        console.log(`[DEBUG] ${type}`, message, data);
    }

    // 2. Connection Checker
    async function checkConnection() {
        logDebug('info', 'Checking connection to Ollama tags...');
        try {
            const response = await fetch(TAGS_ENDPOINT);
            if (response.ok) {
                statusDot.classList.add('online');
                statusDot.title = "Connected to Ollama";
                logDebug('success', 'Connected to API successfully.');
            } else {
                throw new Error('Tags endpoint returned error');
            }
        } catch (error) {
            statusDot.classList.remove('online');
            statusDot.title = "Connection Failed (Check Tunnel/CORS)";
            logDebug('error', 'Connection failed.', error.message);
        }
    }

    // 3. Message Rendering
    function appendMessage(role, text) {
        const rowDiv = document.createElement('div');
        rowDiv.className = `message-row ${role}-row`;
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.innerText = text;
        
        rowDiv.appendChild(msgDiv);
        chatBox.appendChild(rowDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv; // Return message div for potential updates (like streaming)
    }

    function showTyping() {
        const rowDiv = document.createElement('div');
        rowDiv.className = "message-row bot-row";
        rowDiv.id = "typing-indicator-row";
        
        rowDiv.innerHTML = `
            <div class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        `;
        chatBox.appendChild(rowDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
        const indicator = document.getElementById('typing-indicator-row');
        if (indicator) indicator.remove();
    }

    // 4. API Core Logic (SendMessage)
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // UI Updates
        appendMessage('user', text);
        userInput.value = '';
        sendBtn.disabled = true;
        showTyping();

        logDebug('request', 'Sending prompt to /generate', { model: MODEL_NAME, prompt: text });

        try {
            // Hum CORS block hone se bachne ke liye mode: 'cors' add kar rahe hain, 
            // lekin Codespace mein export OLLAMA_ORIGINS="*" zaroori hai.
            const response = await fetch(GENERATE_ENDPOINT, {
                method: 'POST',
                mode: 'cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    prompt: text,
                    stream: false // Simple non-stream request
                })
            });

            if (!response.ok) {
                throw new Error(`API Response Error: ${response.status}`);
            }

            const data = await response.json();
            logDebug('response', 'Received data', data);
            
            removeTyping();
            appendMessage('bot', data.response);

        } catch (error) {
            removeTyping();
            let errorMsg = "Kshama karein, main abhi jawab nahi de pa raha hoon.";
            
            if (error.message.includes('Failed to fetch')) {
                errorMsg += "\n(Mukhya karan: Browser ne request block kar di hai. Codespace terminal mein `export OLLAMA_ORIGINS='*'` set karke `ollama serve` chalayein, ya browser mein CORS extension use karein.)";
            } else {
                errorMsg += `\n(Error Details: ${error.message})`;
            }
            
            appendMessage('bot', errorMsg);
            logDebug('error', 'API Request failed.', error.message);
            statusDot.classList.remove('online'); // Mark offline if request fails
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // 5. Settings & Theme UI Logic
    function toggleSettings() {
        const panel = document.getElementById('settings-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    // Close settings if clicked outside
    document.addEventListener('click', function(event) {
        const panel = document.getElementById('settings-panel');
        const settingsBtn = document.querySelector('.header-btns .icon-btn');
        if (panel.style.display === 'block' && !panel.contains(event.target) && event.target !== settingsBtn) {
            panel.style.display = 'none';
        }
    });

    function toggleTheme() {
        const body = document.body;
        const themeBtn = document.getElementById('theme-toggle');
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            themeBtn.innerText = '🌙';
            themeBtn.title = "Switch to Light Mode";
            logDebug('ui', 'Theme changed to Dark');
        } else {
            body.setAttribute('data-theme', 'light');
            themeBtn.innerText = '☀️';
            themeBtn.title = "Switch to Dark Mode";
            logDebug('ui', 'Theme changed to Light');
        }
    }

    function changeFont(font) {
        document.body.style.fontFamily = font;
        logDebug('ui', `Font changed to ${font}`);
    }

    function toggleDebug(isOn) {
        isDebugOn = isOn;
        debugConsole.style.display = isOn ? 'block' : 'none';
        if (isOn) {
            debugConsole.innerText = "--- Debug Mode Started ---\n";
            checkConnection(); // Re-check connection for debug log
        }
    }
</script>

</body>
</html>
