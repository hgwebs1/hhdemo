<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalStorage Token Test</title>

<style>
body{
    font-family: system-ui, sans-serif;
    background:#f1f5f9;
    padding:20px;
}
h2{
    text-align:center;
    margin-bottom:20px;
}
.card{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}
.key{
    font-weight:800;
    margin-bottom:6px;
}
.value{
    background:#0f172a;
    color:#e5e7eb;
    padding:10px;
    border-radius:8px;
    word-break:break-all;
    font-size:14px;
}
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>🔍 LocalStorage Token Test</h2>

<button onclick="check()">Check Tokens</button>

<div class="card">
    <div class="key">GITHUB_TOKEN</div>
    <div class="value" id="git">Not Found</div>
</div>

<div class="card">
    <div class="key">NETLIFY_TOKEN</div>
    <div class="value" id="netlify">Not Found</div>
</div>

<script>
function check(){
    const git = localStorage.getItem("GITHUB_TOKEN");
    const netlify = localStorage.getItem("NETLIFY_TOKEN");

    document.getElementById("git").textContent =
        git ? git : "❌ Not Found";

    document.getElementById("netlify").textContent =
        netlify ? netlify : "❌ Not Found";
}
</script>

</body>
</html>
