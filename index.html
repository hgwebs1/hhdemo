<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Input Keyboard Test</title>

<!-- 🔒 Mobile viewport lock -->
<meta name="viewport"
      content="width=375, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
  /* Page background (outside phone) */
  body {
    margin: 0;
    min-height: 100vh;
    background: #020617;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }

  /* 📱 Phone frame illusion */
  .phone {
    width: 375px;            /* iPhone-like width */
    min-height: 650px;
    background: #0f172a;
    color: #e5e7eb;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 28px;
    box-shadow:
      0 20px 40px rgba(0,0,0,.6),
      inset 0 0 0 2px #1e293b;
  }

  h2 {
    text-align: center;
    margin-top: 0;
  }

  .box {
    background: #111827;
    border: 1px solid #374151;
    padding: 14px;
    border-radius: 12px;
    margin-top: 20px;
  }

  input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #020617;
    border: 1px solid #334155;
    color: #e5e7eb;
    border-radius: 10px;
    font-size: 16px; /* 🔑 mobile keyboard trigger */
  }

  button {
    margin-top: 12px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
  }
</style>
</head>

<body>

<div class="phone">
  <h2>🔢 Number Input Test</h2>

  <div class="box">
    <b>Number input</b>
    <input id="i5" type="number" placeholder="enter number">
    <button onclick="copyAndFocus('123456','i5')">
      Copy + Focus
    </button>
  </div>
</div>

<script>
function copyAndFocus(text, inputId) {
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById(inputId).focus();
  });
}
</script>

</body>
</html>
