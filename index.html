<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        body { background: #0b0f1a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        input, select, textarea { background: #1a1f2e !important; color: white !important; border: 1px solid #334155 !important; transition: 0.3s; }
        input:focus { border-color: #3b82f6 !important; outline: none; }
        .btn-blue { background: #2563eb; transition: 0.3s; }
        .btn-blue:hover { background: #1d4ed8; }
        .loader { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-5xl mx-auto flex justify-between items-center mb-10">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Cloud Deployer</h1>
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-xs font-mono uppercase tracking-widest text-gray-400">Secure Session</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <section class="p-6 glass rounded-2xl shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-blue-400">🚀 Deploy New Site</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold mb-1 uppercase text-gray-500">GitHub Repository</label>
                    <select id="repoSelect" onchange="fetchBranches()" class="w-full p-3 rounded-xl outline-none"></select>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 uppercase text-gray-500">Branch</label>
                    <select id="branchSelect" class="w-full p-3 rounded-xl outline-none">
                        <option>Select repository first</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 uppercase text-gray-500">Site Subdomain</label>
                    <div class="relative">
                        <input type="text" id="siteName" oninput="checkDomain(this.value)" placeholder="Enter name" class="w-full p-3 rounded-xl outline-none pr-10">
                        <div id="domainLoader" class="hidden absolute right-3 top-3.5 w-5 h-5 border-2 border-gray-600 loader rounded-full"></div>
                    </div>
                    <p id="domainStatus" class="text-xs mt-2 font-medium"></p>
                </div>

                <label class="flex items-center gap-3 p-4 bg-white/5 rounded-xl cursor-pointer hover:bg-white/10 transition">
                    <input type="checkbox" id="autoFunc" class="w-5 h-5 accent-blue-500">
                    <span class="text-sm">Set Netlify Functions directory (/functions)</span>
                </label>

                <div class="pt-4">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-xs font-bold uppercase text-gray-500">Environment Variables</label>
                        <button onclick="addEnvField('envList')" class="text-xs bg-blue-600/20 text-blue-400 border border-blue-400/30 px-3 py-1 rounded-full hover:bg-blue-600 hover:text-white">+ Add</button>
                    </div>
                    <div id="envList" class="space-y-2"></div>
                </div>

                <button onclick="deployNow()" id="deployBtn" class="w-full btn-blue py-4 rounded-xl font-bold text-lg mt-6 shadow-lg">
                    INITIALIZE DEPLOYMENT
                </button>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold mb-6 text-indigo-400">📂 Active Deployments</h2>
            <div id="sitesList" class="space-y-4 max-h-[700px] overflow-y-auto pr-2">
                </div>
        </section>
    </main>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass p-8 rounded-3xl w-full max-w-xl border border-white/10 shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h3 id="modalTitle" class="text-2xl font-bold text-white">Site Settings</h3>
                    <p id="siteIdLabel" class="text-[10px] font-mono text-gray-500 uppercase tracking-tighter"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Rename Site</label>
                    <input type="text" id="editSiteName" class="w-full p-3 rounded-xl">
                </div>

                <div>
                    <div class="flex justify-between mb-3">
                        <label class="text-xs font-bold text-gray-500 uppercase">Configuration Variables</label>
                        <button onclick="addEnvField('modalEnvList')" class="text-xs text-blue-400">+ New Key</button>
                    </div>
                    <div id="modalEnvList" class="space-y-2 max-h-48 overflow-y-auto bg-black/20 p-3 rounded-xl"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
                    <button onclick="triggerManualDeploy()" class="flex items-center justify-center gap-2 bg-orange-600/20 text-orange-400 border border-orange-600/30 py-3 rounded-xl font-bold hover:bg-orange-600 hover:text-white transition">
                        <span>⚡</span> Trigger Build
                    </button>
                    <button onclick="saveSiteSettings()" class="bg-blue-600 py-3 rounded-xl font-bold shadow-xl">
                        Save All Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const HLOCALSAVE = "https://hlocalsave.netlify.app";
        const G_TOKEN = localStorage.getItem("GITHUB_TOKEN");
        const N_TOKEN = localStorage.getItem("NETLIFY_TOKEN");

        async function init() {
            if (!G_TOKEN || !N_TOKEN) {
                const missing = [];
                if(!G_TOKEN) missing.push("GITHUB_TOKEN");
                if(!N_TOKEN) missing.push("NETLIFY_TOKEN");
                window.location.replace(`${HLOCALSAVE}?request=keys&keys=${missing.join(",")}&return=${encodeURIComponent(location.href)}`);
                return;
            }
            fetchRepos();
            fetchSites();
        }

        /* GITHUB & NETLIFY FETCHERS */
        async function fetchRepos() {
            const select = document.getElementById("repoSelect");
            try {
                const res = await fetch('https://api.github.com/user/repos?sort=updated&per_page=50', {
                    headers: { 'Authorization': `token ${G_TOKEN}` }
                });
                const repos = await res.json();
                select.innerHTML = repos.map(r => `<option value="${r.full_name}">${r.full_name}</option>`).join('');
                fetchBranches();
            } catch (e) { select.innerHTML = "<option>Error loading repos</option>"; }
        }

        async function fetchBranches() {
            const repo = document.getElementById("repoSelect").value;
            const select = document.getElementById("branchSelect");
            const res = await fetch(`https://api.github.com/repos/${repo}/branches`, {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const branches = await res.json();
            select.innerHTML = branches.map(b => `<option value="${b.name}">${b.name}</option>`).join('');
        }

        /* REAL-TIME DOMAIN CHECK */
        let domainTimer;
        function checkDomain(name) {
            clearTimeout(domainTimer);
            const status = document.getElementById("domainStatus");
            const loader = document.getElementById("domainLoader");
            if(name.length < 3) { status.innerText = ""; return; }

            loader.classList.remove("hidden");
            domainTimer = setTimeout(async () => {
                try {
                    // Site availability check using Netlify's site search
                    const res = await fetch(`https://api.netlify.com/api/v1/sites?name=${name}`, {
                        headers: { 'Authorization': `Bearer ${N_TOKEN}` }
                    });
                    const sites = await res.json();
                    const exists = sites.some(s => s.name.toLowerCase() === name.toLowerCase());
                    
                    if(!exists) {
                        status.innerText = "Available: " + name + ".netlify.app";
                        status.className = "text-xs mt-2 text-green-400";
                    } else {
                        status.innerText = "Taken: This name is already in use.";
                        status.className = "text-xs mt-2 text-red-400";
                    }
                } catch(e) { status.innerText = "Check failed."; }
                loader.classList.add("hidden");
            }, 600);
        }

        /* DYNAMIC ENV FIELDS */
        function addEnvField(containerId, key = '', val = '') {
            const div = document.createElement('div');
            div.className = "flex gap-2 group";
            div.innerHTML = `
                <input type="text" placeholder="Key" value="${key}" class="w-1/2 p-2 text-sm rounded-lg border-none">
                <input type="text" placeholder="Value" value="${val}" class="w-1/2 p-2 text-sm rounded-lg border-none">
                <button onclick="this.parentElement.remove()" class="text-gray-500 hover:text-red-500 px-2 transition">×</button>
            `;
            document.getElementById(containerId).appendChild(div);
        }

        /* PROJECT LIST & SETTINGS */
        async function fetchSites() {
            const container = document.getElementById("sitesList");
            const res = await fetch('https://api.netlify.com/api/v1/sites', {
                headers: { 'Authorization': `Bearer ${N_TOKEN}` }
            });
            const sites = await res.json();
            container.innerHTML = sites.map(s => `
                <div onclick="openSettings('${s.id}', '${s.name}')" class="p-5 glass rounded-2xl cursor-pointer border border-white/5 hover:border-blue-500/50 transition-all flex justify-between items-center group">
                    <div>
                        <h4 class="font-bold text-lg group-hover:text-blue-400 transition">${s.name}</h4>
                        <p class="text-xs text-gray-500 font-mono">${s.url.replace('https://','')}</p>
                    </div>
                    <div class="bg-white/5 p-2 rounded-lg text-xs opacity-0 group-hover:opacity-100 transition">Manage ⚙️</div>
                </div>
            `).join('');
        }

        let activeSiteId = "";
        function openSettings(id, name) {
            activeSiteId = id;
            document.getElementById("settingsModal").classList.remove("hidden");
            document.getElementById("modalTitle").innerText = name;
            document.getElementById("siteIdLabel").innerText = "ID: " + id;
            document.getElementById("editSiteName").value = name;
            document.getElementById("modalEnvList").innerHTML = "";
            addEnvField('modalEnvList'); // Initial field
        }

        function closeModal() { document.getElementById("settingsModal").classList.add("hidden"); }

        async function triggerManualDeploy() {
            if(!confirm("Trigger new build for this site?")) return;
            const res = await fetch(`https://api.netlify.com/api/v1/sites/${activeSiteId}/builds`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${N_TOKEN}` }
            });
            if(res.ok) alert("Deployment Started!");
        }

        async function saveSiteSettings() {
            const newName = document.getElementById("editSiteName").value;
            // logic to update Netlify site via PATCH /api/v1/sites/{site_id}
            alert("Settings updated for " + newName);
            closeModal();
            fetchSites();
        }

        window.onload = init;
    </script>
</body>
</html>
