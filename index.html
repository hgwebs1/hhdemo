<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS OLLAMA | Enterprise Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --mui-blue: #1976d2;
            --bg-light: #f4f7f9;
            --surface: #ffffff;
            --text-dark: #1a1c1e;
            --terminal-bg: #0d1117;
            --danger: #d32f2f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            padding: 20px 15px;
        }

        .app-container { width: 100%; max-width: 900px; margin: 0 auto; }

        .hero-header { text-align: center; margin-bottom: 30px; }
        .hero-header h1 {
            font-size: 42px; font-weight: 800; letter-spacing: -1.5px;
            background: linear-gradient(90deg, #1976d2, #64b5f6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .glass-card {
            background: var(--surface); border-radius: 24px; padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid #e1e4e8;
            margin-bottom: 30px;
        }

        input[type="password"], input[type="text"] {
            width: 100%; padding: 18px 24px; border-radius: 14px;
            border: 2px solid #edf0f2; font-size: 18px; outline: none;
            transition: 0.2s; margin-bottom: 20px;
        }

        .btn-pro {
            width: 100%; padding: 18px; border-radius: 14px; border: none;
            background: var(--mui-blue); color: white; font-size: 18px;
            font-weight: 700; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 12px;
        }

        /* LIST ITEMS */
        .cs-list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px; border-bottom: 1px solid #f0f2f5; flex-wrap: wrap; gap: 15px;
        }

        .status-pill {
            display: inline-block; padding: 5px 12px; border-radius: 8px;
            font-size: 12px; font-weight: 800; text-transform: uppercase;
        }
        .Available { background: #e6f4ea; color: #1e8e3e; }
        .Shutdown { background: #f1f3f4; color: #5f6368; }

        .action-btns { display: flex; gap: 12px; flex-wrap: wrap; }
        .circle-btn {
            width: 50px; height: 50px; border-radius: 12px; border: 1px solid #e1e4e8;
            background: #fff; color: #5f6368; cursor: pointer; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .circle-btn:hover { background: var(--mui-blue); color: white; }

        /* TERMINAL */
        #terminal-container {
            display: none; background: var(--terminal-bg); border-radius: 20px;
            padding: 25px; margin-top: 30px; border: 1px solid #30363d;
        }

        #term-output {
            height: 250px; overflow-y: auto; color: #d1d5db; font-family: 'Fira Code', monospace;
            font-size: 15px; white-space: pre-wrap; margin-bottom: 20px;
        }

        .term-input-line {
            display: flex; align-items: center; gap: 12px; background: #161b22;
            padding: 12px 20px; border-radius: 12px; border: 1px solid #30363d;
        }
        .term-input-line span { color: #7ee787; font-weight: bold; }
        .term-input-line input {
            background: transparent; border: none; color: white; flex: 1;
            font-family: 'Fira Code', monospace; font-size: 16px; margin: 0; outline: none;
        }

        .send-btn { background: var(--mui-blue); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; }

        /* MODAL */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 10000;
        }
        .modal-card { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
        .modal-actions { display: flex; gap: 12px; margin-top: 25px; }
        .m-btn { flex: 1; padding: 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #1a1c1e; color: white; padding: 16px 32px; border-radius: 50px;
            display: none; z-index: 9999; font-weight: 600;
        }

        .logout-link { text-align: center; margin-top: 30px; color: var(--danger); cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="hero-header">
        <h1>CS OLLAMA</h1>
        <p>Enterprise Codespace Controller</p>
    </header>

    <div id="auth-section" class="glass-card">
        <div style="font-size: 20px; font-weight: 700; margin-bottom: 25px;">Connect Account</div>
        <input type="password" id="token-field" placeholder="Enter GITHUB_TOKEN10">
        <button class="btn-pro" onclick="saveAuth()">Initialize Connection</button>
    </div>

    <div id="dash-section" style="display: none;">
        <div class="glass-card" style="padding: 0;">
            <div style="padding: 20px 30px; border-bottom: 1px solid #f0f2f5; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 18px;">Your Environments</h2>
                <button onclick="refreshData()" style="border:none; background:none; color:var(--mui-blue); font-weight:700; cursor:pointer;">REFRESH</button>
            </div>
            <div id="list-render"></div>
        </div>

        <div id="terminal-container">
            <div id="term-output">System: Authenticated. Initializing shell...</div>
            <div class="term-input-line">
                <span>$</span>
                <input type="text" id="term-input" placeholder="Enter real command...">
                <button class="send-btn" onclick="handleCommand()">RUN</button>
            </div>
        </div>

        <div class="logout-link" onclick="logout()">Disconnect Account</div>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal-card">
        <h3>Stop Codespace?</h3>
        <p>Are you sure? This will terminate all active processes.</p>
        <div class="modal-actions">
            <button class="m-btn" style="background:#f1f3f4;" onclick="closeModal()">Cancel</button>
            <button id="confirm-stop" class="m-btn" style="background:var(--danger); color:white;">Stop Now</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    const STORAGE_KEY = "GITHUB_TOKEN10";
    let activeCS = "";
    let stopTarget = "";

    function showToast(text) {
        const t = document.getElementById('toast');
        t.innerText = text; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 4000);
    }

    function saveAuth() {
        const val = document.getElementById('token-field').value.trim();
        if(val) {
            localStorage.setItem(STORAGE_KEY, val);
            checkState();
        }
    }

    function logout() {
        if(confirm("Logout?")) {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }
    }

    async function refreshData() {
        const token = localStorage.getItem(STORAGE_KEY);
        const render = document.getElementById('list-render');
        render.innerHTML = '<div style="padding:40px; text-align:center;">Syncing...</div>';
        try {
            const res = await fetch("https://api.github.com/user/codespaces", {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            render.innerHTML = "";
            data.codespaces.forEach(cs => {
                const item = document.createElement('div');
                item.className = 'cs-list-item';
                item.innerHTML = `
                    <div class="cs-info">
                        <span style="font-weight:700; font-size:18px;">${cs.name}</span><br>
                        <span class="status-pill ${cs.state}">${cs.state}</span>
                    </div>
                    <div class="action-btns">
                        <button class="circle-btn" onclick="startSpace('${cs.name}')"><i class="fa-solid fa-play"></i></button>
                        <button class="circle-btn" onclick="openModal('${cs.name}')"><i class="fa-solid fa-stop"></i></button>
                        <button class="circle-btn" onclick="window.open('${cs.web_url}')"><i class="fa-solid fa-external-link"></i></button>
                    </div>`;
                render.appendChild(item);
            });
        } catch (e) { showToast("Sync failed."); }
    }

    async function startSpace(name) {
        const token = localStorage.getItem(STORAGE_KEY);
        showToast("Starting...");
        try {
            await fetch(`https://api.github.com/user/codespaces/${name}/start`, {
                method: "POST", headers: { "Authorization": `Bearer ${token}` }
            });
            showToast("Codespace started! 🚀");
            activeCS = name;
            document.getElementById('terminal-container').style.display = 'block';
            refreshData();
        } catch (e) { showToast("Error."); }
    }

    function openModal(name) { stopTarget = name; document.getElementById('modal-overlay').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    document.getElementById('confirm-stop').onclick = async () => {
        const token = localStorage.getItem(STORAGE_KEY);
        closeModal();
        showToast("Stopping...");
        await fetch(`https://api.github.com/user/codespaces/${stopTarget}/stop`, {
            method: "POST", headers: { "Authorization": `Bearer ${token}` }
        });
        showToast("Stopped.");
        refreshData();
    };

    async function handleCommand() {
        const input = document.getElementById('term-input');
        const output = document.getElementById('term-output');
        const token = localStorage.getItem(STORAGE_KEY);
        const cmd = input.value.trim();

        if(!cmd || !activeCS) return;
        output.innerHTML += `\n<span style="color:#7ee787">$</span> ${cmd}`;
        input.value = "";

        try {
            // Yahan Netlify function call hogi real output ke liye
            const res = await fetch('/.netlify/functions/execute', {
                method: 'POST',
                body: JSON.stringify({ command: cmd, codespaceName: activeCS, token: token })
            });
            const data = await res.json();
            output.innerHTML += `\n${data.output || data.error}`;
        } catch (e) {
            output.innerHTML += `\n[Error] Could not connect to Netlify Function.`;
        }
        output.scrollTop = output.scrollHeight;
    }

    function checkState() {
        const token = localStorage.getItem(STORAGE_KEY);
        if(token) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dash-section').style.display = 'block';
            refreshData();
        }
    }

    window.onload = checkState;
</script>

</body>
</html>
