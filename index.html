<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalStorage Checker</title>

<style>
  body{
    margin:0;
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg,#e3f2fd,#ffffff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:12px;
  }

  .app{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    padding:16px;
  }

  h1{
    font-size:20px;
    text-align:center;
    margin:0 0 10px;
  }

  button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:#fff;
    font-size:14px;
    cursor:pointer;
  }

  button:active{
    transform:scale(0.98);
  }

  .list{
    margin-top:12px;
  }

  .item{
    border:1px solid #eee;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
  }

  .key{
    font-weight:600;
    word-break:break-all;
  }

  .value{
    font-size:12px;
    color:#555;
    margin:6px 0;
    max-height:60px;
    overflow:auto;
  }

  .del{
    background:#e53935;
    margin-top:5px;
  }

  .empty{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-top:20px;
  }
</style>
</head>
<body>

<div class="app">
  <h1>📦 LocalStorage Keys</h1>
  <button onclick="loadKeys()">🔄 Refresh</button>

  <div id="list" class="list"></div>
</div>

<script>
function loadKeys(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  if(localStorage.length === 0){
    list.innerHTML = '<div class="empty">❌ No localStorage keys found</div>';
    return;
  }

  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    const value = localStorage.getItem(key);

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <div class="key">🔑 ${key}</div>
      <div class="value">${escapeHtml(value)}</div>
      <button class="del" onclick="removeKey('${key}')">🗑️ Delete</button>
    `;

    list.appendChild(div);
  }
}

function removeKey(key){
  if(confirm("Delete key: " + key + " ?")){
    localStorage.removeItem(key);
    loadKeys();
  }
}

function escapeHtml(text){
  if(!text) return "";
  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

// Auto load on start
loadKeys();
</script>

</body>
</html>
