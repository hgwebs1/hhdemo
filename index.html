<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number & Tel Copy Keyboard Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{
    font-family: system-ui, sans-serif;
    background:#0f172a;
    color:#e5e7eb;
    padding:20px;
  }
  .item{
    background:#111827;
    border:1px solid #374151;
    padding:14px;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    user-select:none;
  }
  .hint{
    font-size:12px;
    opacity:.7;
    margin-top:4px;
  }
  input{
    position:absolute;
    opacity:0;
    pointer-events:none;
  }
</style>
</head>
<body>

<h2>📋 Copy + Hidden Keyboard Test</h2>

<!-- NUMBER -->
<div class="item" onclick="copyNumber()">
  🔢 Copy Number: <b>123456</b>
  <div class="hint">type="number"</div>
</div>

<!-- TEL -->
<div class="item" onclick="copyTel()">
  📞 Copy Phone: <b>+91 99999 99999</b>
  <div class="hint">type="tel"</div>
</div>

<!-- Hidden Inputs -->
<input id="numInput" type="number">
<input id="telInput" type="tel">

<script>
function copyNumber(){
  navigator.clipboard.writeText("123456").then(()=>{
    document.getElementById("numInput").focus();
  });
}

function copyTel(){
  navigator.clipboard.writeText("+919999999999").then(()=>{
    document.getElementById("telInput").focus();
  });
}
</script>

</body>
</html>
