<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netlify Name Check + Deploy</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#010409; color:#e6edf3; font-family:Segoe UI,sans-serif }
.glass { background:rgba(10,15,28,.95); border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(14px) }
input,select { background:#0d1117!important; border:1px solid #30363d!important; color:#c9d1d9!important }
</style>
</head>

<body class="p-6 md:p-10">

<div class="max-w-5xl mx-auto space-y-8">

<!-- ================= NAME CHECK BOX ================= -->

<div class="glass p-6 rounded-2xl">
<h2 class="text-sm font-bold text-blue-400 mb-3 uppercase">Check Site Name</h2>

<div class="flex gap-2">
<input id="checkName" placeholder="my-awesome-site" class="flex-1 p-3 rounded-xl text-sm">
<button onclick="checkOnly()" class="px-5 bg-blue-600 rounded-xl text-xs font-bold">
CHECK
</button>
</div>

<p id="checkResult" class="text-xs mt-3"></p>

<p class="text-[10px] text-gray-500 mt-2">
ℹ This check does NOT reserve the name. Final availability is confirmed during deployment.
</p>
</div>

<!-- ================= DEPLOY SECTION ================= -->

<div class="glass p-8 rounded-3xl">
<h2 class="text-lg font-bold text-blue-400 mb-6">Create & Deploy Site</h2>

<div class="space-y-4">

<div>
<label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">
Site Name
</label>
<input id="siteName" class="w-full p-3 rounded-xl text-sm" placeholder="my-awesome-site">
</div>

<div>
<label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">
GitHub Repository (optional)
</label>
<input id="repo" class="w-full p-3 rounded-xl text-sm" placeholder="username/repo">
</div>

<div>
<label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">
Branch (optional)
</label>
<input id="branch" class="w-full p-3 rounded-xl text-sm" placeholder="main">
</div>

<button onclick="deploySite()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-bold text-xs tracking-widest mt-4">
DEPLOY
</button>

<p id="deployStatus" class="text-xs mt-4"></p>

</div>
</div>

</div>

<script>
const N_TOKEN = localStorage.getItem("NETLIFY_TOKEN");

/* ================= NAME CHECK (SAFE & HONEST) ================= */

function checkOnly(){
    const name = checkName.value.trim();
    const res = document.getElementById("checkResult");

    if(!/^[a-z0-9-]{3,}$/.test(name)){
        res.innerText = "❌ Invalid format (use a–z, 0–9, hyphen, min 3 chars)";
        res.className = "text-red-500 text-xs";
        return;
    }

    res.innerText = "✔ Format valid — availability will be checked during deployment";
    res.className = "text-yellow-400 text-xs";
}

/* ================= DEPLOY (REAL CHECK HERE) ================= */

async function deploySite(){
    const name = siteName.value.trim();
    const repo = repo.value.trim();
    const branch = branch.value.trim() || "main";
    const status = document.getElementById("deployStatus");

    if(!name){
        status.innerText = "❌ Site name required";
        status.className = "text-red-500";
        return;
    }

    status.innerText = "⏳ Creating site…";
    status.className = "text-yellow-400";

    let body = { name };

    if(repo){
        body.repo = {
            provider: "github",
            repo: repo,
            branch: branch
        };
    }

    try{
        const res = await fetch("https://api.netlify.com/api/v1/sites",{
            method:"POST",
            headers:{
                Authorization:`Bearer ${N_TOKEN}`,
                "Content-Type":"application/json"
            },
            body: JSON.stringify(body)
        });

        if(res.status === 422){
            status.innerText = "❌ Name already taken. Try another.";
            status.className = "text-red-500";
            return;
        }

        if(res.ok){
            const data = await res.json();
            status.innerText = `✅ Site created: ${data.name}.netlify.app`;
            status.className = "text-green-500";
        } else {
            status.innerText = "❌ Failed to create site";
            status.className = "text-red-500";
        }

    }catch(err){
        status.innerText = "❌ Network / API error";
        status.className = "text-red-500";
    }
}
</script>

</body>
</html>
