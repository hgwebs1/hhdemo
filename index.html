<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FastPaste</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA basic -->
  <meta name="theme-color" content="#f5f7fa" />
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .box {
      width: 95%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h2 {
      margin: 0 0 10px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 200px;
      resize: none;
      padding: 10px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .note {
      font-size: 12px;
      color: #555;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>📋 FastPaste</h2>

    <textarea id="output" placeholder="Clipboard content yahan aayega..."></textarea>

    <button onclick="pasteFromClipboard()">Paste from Clipboard</button>

    <div class="note">
      Android • Browser • PWA supported
    </div>
  </div>

  <script>
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("output").value = text;
      } catch (e) {
        alert("Clipboard access denied. Button click required & HTTPS needed.");
      }
    }

    // PWA Service Worker register
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
