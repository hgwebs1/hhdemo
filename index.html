<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Cloud Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(10, 15, 28, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        body { background: #010409; color: #e6edf3; font-family: 'Segoe UI', sans-serif; }
        input, select { background: #0d1117 !important; border: 1px solid #30363d !important; color: #c9d1d9 !important; transition: 0.2s; }
        input:focus { border-color: #388bfd !important; outline: none; box-shadow: 0 0 0 3px rgba(56,139,253,0.1); }
        .loader { border-top-color: #388bfd; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6 md:p-10">

    <header class="max-w-6xl mx-auto flex justify-between items-center mb-10 border-b border-gray-800 pb-6">
        <h1 class="text-xl font-bold tracking-tight">NETLIFY<span class="text-blue-500 underline decoration-2 underline-offset-4 ml-1">CONSOLE</span></h1>
        <div id="authStatus" class="flex items-center gap-2 text-[10px] font-mono text-gray-400">
            <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span> SYSTEM_READY
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <section class="lg:col-span-5 space-y-6">
            <div class="p-8 glass rounded-3xl border border-blue-500/10">
                <h2 class="text-lg font-bold mb-6 text-blue-400">Launch Project</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">GitHub Repository</label>
                        <select id="repoSelect" onchange="fetchBranches()" class="w-full p-3 rounded-xl text-sm"></select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Deployment Branch</label>
                        <select id="branchSelect" class="w-full p-3 rounded-xl text-sm"></select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Official Subdomain</label>
                        <div class="relative">
                            <input type="text" id="siteName" oninput="checkDomain(this.value)" placeholder="my-awesome-site" class="w-full p-3 rounded-xl text-sm pr-10">
                            <div id="domainLoader" class="hidden absolute right-3 top-3.5 w-4 h-4 border-2 border-gray-600 loader rounded-full"></div>
                        </div>
                        <p id="domainStatus" class="text-[11px] mt-2 font-medium"></p>
                    </div>

                    <div class="pt-4 border-t border-gray-800">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-[10px] font-bold text-gray-500 uppercase">Initialization Variables</span>
                            <button onclick="addEnvField('envList')" class="text-blue-500 text-[10px] font-bold border border-blue-500/20 px-3 py-1 rounded-lg hover:bg-blue-500/10 transition">+ NEW</button>
                        </div>
                        <div id="envList" class="space-y-2"></div>
                    </div>

                    <button onclick="deploySite()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-bold text-xs tracking-widest mt-4 transition shadow-lg shadow-blue-900/20">
                        DEPLOY TO PRODUCTION
                    </button>
                </div>
            </div>
        </section>

        <section class="lg:col-span-7">
            <h3 class="text-sm font-bold text-gray-500 mb-6 uppercase tracking-widest">Active Deployments</h3>
            <div id="sitesList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>
    </main>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-sm flex items-center justify-center p-6 z-50">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-lg border border-white/10">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h3 id="modalTitle" class="text-xl font-bold text-white">Project Config</h3>
                    <p id="activeId" class="text-[9px] font-mono text-gray-500 mt-1 uppercase"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-500 hover:text-white text-2xl">&times;</button>
            </div>
            
            <div class="space-y-6">
                <div>
                    <div class="flex justify-between mb-3">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Environment Variables</label>
                        <button onclick="addEnvField('modalEnvList')" class="text-blue-500 text-[10px] font-bold">+ ADD KEY</button>
                    </div>
                    <div id="modalEnvList" class="space-y-2 bg-black/50 p-4 rounded-2xl max-h-48 overflow-y-auto"></div>
                </div>

                <div class="pt-6 border-t border-gray-800 space-y-4">
                    <button id="saveBtn" onclick="saveOfficialSettings()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-bold text-xs tracking-widest transition">
                        SAVE CONFIGURATION
                    </button>
                    <button id="triggerBtn" onclick="triggerBuild()" class="w-full bg-transparent border border-gray-700 hover:bg-white/5 py-4 rounded-2xl font-bold text-xs tracking-widest transition">
                        ⚡ TRIGGER MANUAL BUILD
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const G_TOKEN = localStorage.getItem("GITHUB_TOKEN");
        const N_TOKEN = localStorage.getItem("NETLIFY_TOKEN");
        let currentSiteId = "";

        async function init() {
            if (!G_TOKEN || !N_TOKEN) return;
            fetchRepos();
            fetchSites();
        }

        // Official Domain Check: Using the sites list filter method as per Netlify guidelines
        let checkTimeout;
        function checkDomain(name) {
            clearTimeout(checkTimeout);
            const status = document.getElementById("domainStatus");
            const loader = document.getElementById("domainLoader");
            if(name.length < 3) { status.innerText = ""; return; }

            loader.classList.remove("hidden");
            checkTimeout = setTimeout(async () => {
                try {
                    // Documentation approach: Query sites with specific name filter
                    const res = await fetch(`https://api.netlify.com/api/v1/sites?name=${name}`, {
                        headers: { 'Authorization': `Bearer ${N_TOKEN}` }
                    });
                    const results = await res.json();
                    
                    // If results array contains a site with this exact name
                    const exists = results.some(s => s.name.toLowerCase() === name.toLowerCase());
                    
                    if(!exists) {
                        status.innerText = "✓ " + name + ".netlify.app is available";
                        status.className = "text-[11px] mt-2 text-green-500 font-bold";
                    } else {
                        status.innerText = "✕ Name already claimed on Netlify";
                        status.className = "text-[11px] mt-2 text-red-500 font-bold";
                    }
                } catch(e) { status.innerText = "Validation Service Offline"; }
                loader.classList.add("hidden");
            }, 700);
        }

        function addEnvField(containerId, key = '', val = '') {
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="KEY" value="${key}" class="w-1/2 p-2.5 text-[10px] rounded-lg font-bold env-key">
                <input type="text" placeholder="VALUE" value="${val}" class="w-1/2 p-2.5 text-[10px] rounded-lg env-val">
                <button onclick="this.parentElement.remove()" class="text-gray-600 hover:text-red-500 px-1">✕</button>
            `;
            document.getElementById(containerId).appendChild(div);
        }

        async function fetchRepos() {
            const res = await fetch('https://api.github.com/user/repos?sort=updated', {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const repos = await res.json();
            document.getElementById("repoSelect").innerHTML = repos.map(r => `<option value="${r.full_name}">${r.full_name}</option>`).join('');
            fetchBranches();
        }

        async function fetchBranches() {
            const repo = document.getElementById("repoSelect").value;
            const res = await fetch(`https://api.github.com/repos/${repo}/branches`, {
                headers: { 'Authorization': `token ${G_TOKEN}` }
            });
            const branches = await res.json();
            document.getElementById("branchSelect").innerHTML = branches.map(b => `<option value="${b.name}">${b.name}</option>`).join('');
        }

        async function fetchSites() {
            const res = await fetch('https://api.netlify.com/api/v1/sites', {
                headers: { 'Authorization': `Bearer ${N_TOKEN}` }
            });
            const sites = await res.json();
            document.getElementById("sitesList").innerHTML = sites.map(s => `
                <div onclick="openSettings('${s.id}', '${s.name}')" class="p-6 glass rounded-2xl border border-gray-800 cursor-pointer hover:border-blue-500/50 transition-all group">
                    <h4 class="font-bold text-white group-hover:text-blue-400 transition truncate">${s.name}</h4>
                    <p class="text-[10px] text-gray-500 mt-1">${s.url.replace('https://','')}</p>
                    <div class="mt-4 flex justify-end opacity-0 group-hover:opacity-100 transition">
                        <span class="text-[9px] font-bold text-blue-500 uppercase tracking-widest">Configure ⚙</span>
                    </div>
                </div>
            `).join('');
        }

        function openSettings(id, name) {
            currentSiteId = id;
            document.getElementById("settingsModal").classList.remove("hidden");
            document.getElementById("modalTitle").innerText = name;
            document.getElementById("activeId").innerText = "REF: " + id;
            document.getElementById("modalEnvList").innerHTML = "";
            addEnvField('modalEnvList');
        }

        function closeModal() { document.getElementById("settingsModal").classList.add("hidden"); }

        // Official Documentation Save Logic: Using PATCH on /sites/{site_id}
        async function saveOfficialSettings() {
            const keys = document.querySelectorAll('#modalEnvList .env-key');
            const vals = document.querySelectorAll('#modalEnvList .env-val');
            let envData = {};
            keys.forEach((k, i) => { if(k.value) envData[k.value] = vals[i].value; });

            const btn = document.getElementById("saveBtn");
            btn.innerText = "COMMITTING CHANGES...";
            btn.disabled = true;

            try {
                const res = await fetch(`https://api.netlify.com/api/v1/sites/${currentSiteId}`, {
                    method: 'PATCH',
                    headers: { 
                        'Authorization': `Bearer ${N_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        build_settings: { 
                            env: envData 
                        } 
                    })
                });

                if(res.ok) {
                    alert("Configuration updated successfully on Netlify.");
                    closeModal();
                } else { alert("Failed to update build settings."); }
            } catch(e) { alert("API Connection Error"); }
            
            btn.innerText = "SAVE CONFIGURATION";
            btn.disabled = false;
        }

        async function triggerBuild() {
            if(!confirm("Start a new production build now?")) return;
            const res = await fetch(`https://api.netlify.com/api/v1/sites/${currentSiteId}/builds`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${N_TOKEN}` }
            });
            if(res.ok) alert("Build triggered officially.");
        }

        window.onload = init;
    </script>
</body>
</html>
