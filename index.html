<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastclip Final Sync</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; padding: 20px; text-align: center; }
        .terminal-btn { 
            padding: 25px; background: #1a1a1a; border: 1px solid #00ff00; 
            width: 100%; margin-bottom: 20px; color: #00ff00; font-size: 18px;
        }
        /* Hidden input with zero opacity but standard layout */
        #finalGhostInput {
            position: fixed; top: -500px; width: 100px; height: 50px; opacity: 0;
        }
    </style>
</head>
<body>

    <h3>Termux Height Sync Mode</h3>

    <button class="terminal-btn" onclick="syncProcess('DATA_01')">RUN_CMD_01</button>

    <input type="password" id="finalGhostInput" inputmode="text">

    <script>
        function syncProcess(text) {
            // 1. Copy text
            navigator.clipboard.writeText(text);

            const el = document.getElementById('finalGhostInput');
            
            // 2. Clear previous value to reset patti
            el.value = "";

            // 3. Sabse zaruri: Pehle input ko focus karein
            el.focus();

            // 4. Keyboard height match karne ke liye reset call
            if (window.visualViewport) {
                console.log("Keyboard Height: " + window.visualViewport.height);
            }
        }
    </script>
</body>
</html>
