<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H-Local Save Client</title>

<style>
:root {
  --accent: #5c67f2;
  --bg: #f4f7f6;
}
body {
  font-family: system-ui, sans-serif;
  background: var(--bg);
  display: flex;
  justify-content: center;
  padding-top: 40px;
}
.card {
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  width: 90%;
  max-width: 380px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}
h3 {
  text-align: center;
  margin-bottom: 20px;
}
.status-box {
  background: #f9f9f9;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #eee;
}
.token-row {
  margin-bottom: 12px;
}
.label {
  font-size: 0.75rem;
  color: #777;
  font-weight: 700;
}
.value {
  font-family: monospace;
  font-weight: 600;
  word-break: break-all;
}
</style>
</head>

<body>

<div class="card">
  <h3>H-Local Save Client</h3>

  <div class="status-box">
    <div class="token-row">
      <span class="label">GITHUB_TOKEN</span>
      <span id="gh_val" class="value">Checking…</span>
    </div>

    <div class="token-row">
      <span class="label">NETLIFY_TOKEN</span>
      <span id="nf_val" class="value">Checking…</span>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */

const HLOCALSAVE = "https://hlocalsave.netlify.app";
const REQUIRED_KEYS = ["GITHUB_TOKEN", "NETLIFY_TOKEN"];

/* ================= UI ================= */

function updateUI() {
  const gh = localStorage.getItem("GITHUB_TOKEN");
  const nf = localStorage.getItem("NETLIFY_TOKEN");

  document.getElementById("gh_val").innerText = gh || "Empty";
  document.getElementById("nf_val").innerText = nf || "Empty";
}

/* ================= CHECK & REDIRECT ================= */

function checkTokensOrRedirect() {
  const missing = REQUIRED_KEYS.some(
    key => !localStorage.getItem(key)
  );

  updateUI();

  if (missing) {
    // ⛔ Direct redirect (no popup, no iframe)
    window.location.href = HLOCALSAVE;
  }
}

/* ================= INIT ================= */

document.addEventListener("DOMContentLoaded", checkTokensOrRedirect);
</script>

</body>
</html>
