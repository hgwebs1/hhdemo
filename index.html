<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H-Local Save Client</title>

<style>
:root {
  --accent: #5c67f2;
  --bg: #f4f7f6;
  --card: #ffffff;
  --text: #333;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  display: flex;
  justify-content: center;
  padding: 40px 10px;
}

.card {
  background: var(--card);
  padding: 25px;
  border-radius: 16px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h3 {
  text-align: center;
  margin-bottom: 20px;
  color: var(--text);
}

button {
  width: 100%;
  border: none;
  padding: 14px;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.status-box {
  margin-top: 20px;
  background: #f9f9f9;
  border-radius: 12px;
  padding: 15px;
  border: 1px solid #eee;
}

.token-row {
  margin-bottom: 14px;
}

.label {
  font-size: 0.72rem;
  color: #777;
  font-weight: 700;
}

.value {
  margin-top: 4px;
  font-family: monospace;
  font-size: 0.85rem;
  font-weight: 600;
  word-break: break-all;
  color: #111;
}
</style>
</head>

<body>

<div class="card">
  <h3>H-Local Save Client</h3>

  <button onclick="manualSync()">🔄 Sync Tokens</button>

  <div class="status-box">
    <div class="token-row">
      <span class="label">GITHUB_TOKEN</span>
      <span id="gh_val" class="value">Checking…</span>
    </div>

    <div class="token-row">
      <span class="label">NETLIFY_TOKEN</span>
      <span id="nf_val" class="value">Checking…</span>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */

const HLOCALSAVE = "https://hlocalsave.netlify.app";
const REQUIRED_KEYS = ["GITHUB_TOKEN", "NETLIFY_TOKEN"];

/* ================= UI ================= */

function updateUI() {
  document.getElementById("gh_val").innerText =
    localStorage.getItem("GITHUB_TOKEN") || "Empty";

  document.getElementById("nf_val").innerText =
    localStorage.getItem("NETLIFY_TOKEN") || "Empty";
}

/* ================= SYNC CORE ================= */

function requestTokens(auto = false) {
  const popup = window.open(
    HLOCALSAVE,
    "HLocalSaveSync",
    "width=420,height=620"
  );

  const receive = (event) => {
    if (event.origin !== HLOCALSAVE) return;

    if (event.data?.type === "SEND_KEYS") {
      const tokens = event.data.tokens || {};

      if (tokens.GITHUB_TOKEN)
        localStorage.setItem("GITHUB_TOKEN", tokens.GITHUB_TOKEN);

      if (tokens.NETLIFY_TOKEN)
        localStorage.setItem("NETLIFY_TOKEN", tokens.NETLIFY_TOKEN);

      updateUI();
      window.removeEventListener("message", receive);
      popup?.close();
    }
  };

  window.addEventListener("message", receive);

  const ping = setInterval(() => {
    if (popup.closed) {
      clearInterval(ping);
      return;
    }

    popup.postMessage(
      {
        type: "REQUEST_KEYS",
        keys: REQUIRED_KEYS
      },
      HLOCALSAVE
    );
  }, 1200);
}

/* ================= AUTO CHECK ================= */

function autoCheck() {
  const missing = REQUIRED_KEYS.some(
    k => !localStorage.getItem(k)
  );

  updateUI();

  if (missing) {
    requestTokens(true);
  }
}

/* ================= MANUAL ================= */

function manualSync() {
  requestTokens(false);
}

/* ================= INIT ================= */

document.addEventListener("DOMContentLoaded", autoCheck);
</script>

</body>
</html>
