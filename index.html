<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastclip Keyboard Lab</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            padding: 20px; 
            background: #f4f7f6; 
            color: #333;
            text-align: center;
        }
        .container { max-width: 500px; margin: auto; }
        
        .test-box {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid #ddd;
        }
        
        h3 { color: #007bff; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; margin-bottom: 20px; }

        .list-item { 
            padding: 25px; 
            background: #eef2f3; 
            margin-bottom: 15px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            border: 1px solid #dcdde1;
            transition: 0.2s;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        .list-item:active { 
            background: #d1d8e0; 
            transform: scale(0.96); 
        }

        /* Hidden Trigger Inputs */
        #inputTel, #inputMethod2 {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Fastclip Mini Mode Test</h2>

        <div class="test-box">
            <h3>Method 1: Raw Tel Mode</h3>
            <p>(No Delay, Direct Focus, Type=Tel)</p>
            <div class="list-item" onclick="runTelMode('Copying from Tel Mode')">
                List Item 1 (Tel)
            </div>
            <div class="list-item" onclick="runTelMode('Fastclip Item 2')">
                List Item 2 (Tel)
            </div>
        </div>

        <div class="test-box">
            <h3>Method 2: Hybrid Mode</h3>
            <p>(Password type + Autocomplete Off)</p>
            <div class="list-item" onclick="runHybridMode('Copying from Hybrid')">
                List Item A (Hybrid)
            </div>
            <div class="list-item" onclick="runHybridMode('Fastclip Item B')">
                List Item B (Hybrid)
            </div>
        </div>
    </div>

    <input type="tel" id="inputTel">
    <input type="password" id="inputMethod2" autocomplete="off" spellcheck="false">

    <script>
        // METHOD 1: RAW TEL MODE (Bilkul Simple)
        function runTelMode(text) {
            // 1. Copy Text
            navigator.clipboard.writeText(text);
            
            // 2. Direct Focus
            const el = document.getElementById('inputTel');
            el.focus();
        }

        // METHOD 2: HYBRID MODE (Password Trick)
        function runHybridMode(text) {
            // 1. Copy Text
            navigator.clipboard.writeText(text);

            // 2. Direct Focus on Password field
            // Password fields me aksar keyboard toolbar (patti) security ki wajah se hide ho jati hai
            const el = document.getElementById('inputMethod2');
            el.focus();
        }
    </script>

</body>
</html>
