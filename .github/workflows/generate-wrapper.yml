name: Generate Gradle Wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - hhdemo3

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Create minimal Gradle project
        run: |
          echo 'rootProject.name = "Kotlin-Template-Action"' > settings.gradle.kts
          echo '// minimal build file' > build.gradle.kts

      - name: Download Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.2.1-bin.zip -o gradle.zip
          unzip gradle.zip
          echo "$PWD/gradle-9.2.1/bin" >> $GITHUB_PATH

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.2.1

      - name: Verify
        run: ./gradlew --version

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gradlew gradle settings.gradle.kts build.gradle.kts
          git commit -m "Add Gradle wrapper (9.2.1)"
          git push